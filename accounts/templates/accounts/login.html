{% extends "base.html" %}
{% load socialaccount %}
{% block title %}로그인{% endblock %}

{% block content %}
<div class="card" style="max-width:400px;margin:60px auto;">
  <h1 style="margin-bottom:20px;">로그인</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary btn-block">로그인</button>
  </form>

  <div style="display:flex;align-items:center;gap:10px;margin:20px 0;">
    <hr style="flex:1;border:none;border-top:1px solid #ddd;">
    <span class="muted">또는</span>
    <hr style="flex:1;border:none;border-top:1px solid #ddd;">
  </div>

  <a href="{% provider_login_url 'kakao' %}"
     style="display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;background:#FEE500;color:#000000D9;border-radius:6px;font-weight:600;text-decoration:none;">
    <svg width="18" height="18" viewBox="0 0 256 256" aria-hidden="true">
      <path fill="#000000" d="M128 36C70.6 36 24 72.7 24 118c0 29.3 19.5 55 48.7 69.5-1.6 5.5-10.2 35.3-10.6 37.7 0 0-.2 1.8.9 2.4s2.5.2 2.5.2c3.3-.5 38-24.8 44-29 6.1.9 12.3 1.3 18.4 1.3 57.4 0 104-36.7 104-82S185.4 36 128 36"/>
    </svg>
    카카오로 로그인
  </a>

  <p style="margin-top:16px;text-align:center;" class="muted">
    계정이 없으신가요? <a href="{% url 'accounts:signup' %}">회원가입</a>
  </p>
</div>
{% endblock %}
